[project]
name = "crate-backend"
version = "0.1.0"
description = "Crate API backend"
authors = [
    { name = "lukeklotz", email = "lukeklotz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    # The sound-phrase tests run the real parser, so dev always has it.
    { include-group = "phrases" },
]
# Only the embedding build script needs these (torch is a large download);
# the API and the tests never import them.
embeddings = [
    "sentence-transformers>=3.0.0",
]
# The sound-phrase build (build_tfidf_model --sound-phrases) parses articles
# with spaCy. Pinned to the versions the extraction rules were tuned on,
# because parses (and so the rule tests) change between model versions.
phrases = [
    "spacy==3.8.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# B008: FastAPI's Depends(...) is meant to be called in argument defaults.
ignore = ["B008"]
