services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crate
      POSTGRES_PASSWORD: crate_dev_password
      POSTGRES_DB: crate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crate -d crate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      CRATE_DATABASE_URL: postgresql+asyncpg://crate:crate_dev_password@db:5432/crate
      CRATE_ENVIRONMENT: development
      CRATE_AUTH_SECRET: insecure-dev-secret-change-me-before-deploying-anywhere
      CRATE_ACCESS_TOKEN_LIFETIME_SECONDS: "3600"
      CRATE_COOKIE_SECURE: "false"
      CRATE_ALLOWED_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    command: sh -c "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn crate_backend.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
