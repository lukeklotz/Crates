share = 11
terms = ["indietronica", "motorik", "krautrock", "experimental pop", "avant pop",
         "psychedelic pop", "electronica", "retro futurism", "space rock revival"]
broad_terms = ["indie pop", "electronic", "post rock", "pop", "experimental"]

